<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>建築プレゼンテーションプラットフォームの検討</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--mat:#2e4a42;--paper:#fbfbfa;--back:#ecece8;--ink:#1a2230;--sub:#5c6672;--line:#d5d9de;--pane:#f1f3f5;--acc:#1e56c8;--tint:#eaf0fb;
--f:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;--m:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);color:var(--ink);background-color:var(--mat);
background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
background-size:120px 120px,120px 120px,24px 24px,24px 24px}
#stage{position:fixed;left:22px;top:18px;right:36px;bottom:78px;perspective:2600px;touch-action:pan-y}
#stage.drag{cursor:grabbing;user-select:none}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:0 50%;will-change:transform}
.face{position:absolute;inset:0;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -8px rgba(0,0,0,.4)}
.back{transform:rotateY(180deg);background:var(--back)}
.fx{position:absolute;inset:0;pointer-events:none;display:block}
.front .curl{background:linear-gradient(90deg,transparent 30%,rgba(0,0,0,calc(var(--cu,0)*.3))),linear-gradient(100deg,transparent 60%,rgba(255,255,255,calc(var(--cu,0)*.4)) 82%,transparent 94%)}
.back .curl{background:linear-gradient(270deg,transparent 30%,rgba(0,0,0,calc(var(--cu,0)*.3))),linear-gradient(260deg,transparent 60%,rgba(255,255,255,calc(var(--cu,0)*.3)) 82%,transparent 94%)}
.cast{background:linear-gradient(90deg,rgba(8,16,12,0) 0,rgba(8,16,12,var(--ca,0)) calc(var(--ex,0)*100%),rgba(8,16,12,0) calc(var(--ex,0)*100% + 26%))}
.front{padding:20px}
.fr{height:100%;border:1.5px solid var(--ink);display:grid;grid-template-rows:auto 1fr auto;min-height:0}
header,footer{display:flex;font-size:12px;color:var(--sub)}
header{justify-content:space-between;align-items:center;height:42px;padding:0 20px;border-bottom:1px solid var(--ink)}
header b{color:var(--ink);font-weight:700}
footer{height:58px;border-top:1px solid var(--ink)}
footer>span{display:flex;flex-direction:column;justify-content:center;padding:0 20px;line-height:1.4;min-width:0}
footer .snd{flex:1}footer .pj,footer .no{border-left:1px solid var(--ink)}
footer em{font-style:normal;font-size:10px}
footer strong{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer .no strong{color:var(--acc);font-size:19px;font-weight:900}
main{display:grid;grid-template-columns:minmax(280px,.36fr) 1fr;gap:clamp(20px,3vw,48px);padding:clamp(16px,3vh,30px) clamp(20px,2.6vw,36px);min-height:0}
.txt{overflow:auto;padding-right:6px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--acc);border-left:3px solid var(--acc);padding:1px 0 1px 10px;margin-bottom:16px}
h1,h2{font-family:var(--m);font-weight:800;line-height:1.3;letter-spacing:.01em}
h2{font-size:clamp(25px,2.7vw,40px);margin-bottom:20px}
.txt p{font-size:clamp(14px,1.15vw,16.5px);line-height:1.95;color:#2b3542;margin-bottom:12px}
.leg{list-style:none;margin-top:16px;border-top:1px solid var(--line)}
.leg li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.leg i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:1px}
.pw{display:inline-flex;gap:10px;align-items:center;background:var(--tint);border-left:3px solid var(--acc);padding:8px 14px;font-size:14px;margin:4px 0 14px}
.pw code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--acc)}
.flow{list-style:none;margin:18px 0}
.flow li{position:relative;padding:12px 16px;border:1.5px solid var(--ink);font-weight:700;font-size:15px;background:#fff}
.flow li+li{margin-top:22px}
.flow li+li:before{content:"";position:absolute;left:24px;top:-22px;height:22px;border-left:1.5px solid var(--acc)}
.flow li+li:after{content:"";position:absolute;left:20px;top:-8px;border:4px solid transparent;border-top:7px solid var(--acc);border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chips span{border:1px solid var(--ink);padding:4px 12px;font-size:13px;background:#fff}
a{color:var(--acc)}
.imgs{display:grid;gap:12px;min-height:0;min-width:0}
.g1{grid-template-rows:1fr}.g2{grid-template-rows:1fr 1fr}
.g3{grid-template-columns:1fr 1fr;grid-template-rows:1.3fr 1fr}.g3 figure:first-child{grid-column:1/3}
.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
figure{position:relative;min-height:0;min-width:0;background:var(--pane);border:1px solid var(--line);cursor:zoom-in;display:flex}
figure img{width:100%;height:100%;object-fit:contain;display:block}
figcaption{position:absolute;left:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);border-right:1px solid var(--line);font-size:11px;padding:2px 8px;color:var(--sub)}
.cover main{grid-template-columns:minmax(300px,.46fr) 1fr;align-items:center}
.cover h1{font-size:clamp(30px,4.2vw,64px);margin-bottom:28px}
.cover dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:14px;border-top:1px solid var(--ink);padding-top:16px;max-width:460px}
.cover dt{color:var(--sub)}
.cover .url{margin-top:18px;font-size:14px;word-break:break-all}
.cover .imgs{height:100%;max-height:640px}
#rule{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:5;max-width:calc(100% - 16px)}
#rule button{border:0;background:none;cursor:pointer;color:rgba(255,255,255,.75)}
#rule button:hover{color:#fff}
.arr{width:36px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.35)!important}
#ticks{display:flex}
.tick{width:26px;height:34px;position:relative}
.tick:before{content:"";position:absolute;left:50%;bottom:4px;width:1.5px;height:12px;background:currentColor;transform:translateX(-50%);opacity:.6;transition:height .25s}
.tick[aria-current=true]{color:#fff}.tick[aria-current=true]:before{height:26px;opacity:1;width:2.5px}
#rule button:focus-visible,#lb:focus-visible{outline:2px solid #fff;outline-offset:2px}
#lb{position:fixed;inset:0;background:rgba(20,32,28,.9);z-index:10;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb.on{display:flex}#lb.on img{animation:z .25s ease}
#lb img{max-width:100%;max-height:100%;border:8px solid var(--paper)}
@keyframes z{from{opacity:0;transform:scale(.96)}}
@media(max-width:820px){
#stage{left:8px;top:8px;right:16px;bottom:64px}.front{padding:8px}
main,.cover main{display:block;overflow:auto;padding:16px}
.txt{overflow:visible;padding:0}
.imgs{display:flex;flex-direction:column;margin-top:18px}.cover .imgs{height:auto}
figure{display:block}figure img{height:auto;object-fit:initial}
footer .snd{display:none}footer .pj{border-left:0;flex:1}footer>span{padding:0 12px}
.tick{width:19px}.arr{width:32px}}
@media(prefers-reduced-motion:reduce){#lb.on img{animation:none}.tick:before{transition:none}}
.rig{position:absolute;inset:0;display:none;transform-style:preserve-3d}
.sheet.flip>.face{display:none}.sheet.flip>.rig{display:block}
.st{position:absolute;top:0;bottom:0;transform-style:preserve-3d;transform-origin:0 50%}
.sf,.sb{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 22px -12px rgba(0,0,0,.45)}
.sf .front{position:absolute;top:0;box-shadow:none;backface-visibility:visible;-webkit-backface-visibility:visible}
.sb{transform:rotateY(180deg);background:var(--back)}
.sh{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,var(--h,0)),rgba(255,255,255,var(--h,0))),linear-gradient(rgba(0,0,0,var(--d,0)),rgba(0,0,0,var(--d,0)))}
</style>
</head>
<body>
<div id="stage"></div>
<div id="rule"><button class="arr" id="pv" aria-label="前のシート"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1 2 8l6 7"/></svg></button><div id="ticks"></div><button class="arr" id="nx" aria-label="次のシート"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 1 6 7-6 7"/></svg></button></div>
<div id="lb" role="dialog" aria-label="拡大画像" tabindex="0"><img alt=""></div>
<script>
const P="建築プレゼンテーションプラットフォームの検討";
const I=f=>"images/"+f;
const S=[
{cover:1,date:"2026/9/17 – 9/25",imgs:[["top.jpg",""]],g:"g1"},
{date:"2026/9/17",tag:"概要",title:"ユーザーインターフェース",
 p:["以前、厳さんとお話しした内容をもとに、360° Virtual Tourシステムを少しずつ改善していく予定です。","今回は練習・検証用として、Kajanchi邸のプロジェクトを使用しています。","すべてのアイコンを左下にまとめ、図面はこれまで通り右下に配置しています。画像のアイコンに付けた番号の順に説明します。"],
 leg:[["1","ペン：メモ作成"],["2","メモ一覧"],["3","シェア"],["4","プリント"],["5","VR"],["6","フルスクリーン"],["7","図面"]],
 imgs:[["01_User_Interface.jpg"]],g:"g1"},
{date:"2026/9/17",tag:"No.1",title:"ペンアイコン｜メモ作成",
 p:["メモを作成するためのアイコンです。クリックするとパスワード入力画面が表示され、パスワードを入力するとメモ機能を使用できます。"],pw:"plan",
 p2:["Notesページでは、保存したメモが指定した位置に小さなメモアイコンとして表示されます。アイコンをクリックすると、メモの内容と添付画像が表示されます。"],
 leg:[["A","視点の角度を調整するボタン"],["B","メモを配置する位置を指定するボタン"],["C","部屋を切り替えるボタン"],["D","メモを入力する欄"],["E","画像を添付するボタン"],["F","メモを保存するボタン"]],
 imgs:[["02_Notes.jpg"],["03_Notes.jpg"],["04_notes.jpg"]],g:"g3"},
{date:"2026/9/17",tag:"No.2",title:"メモアイコン｜メモ一覧と印刷",
 p:["プロジェクト内に保存されているすべてのメモを一覧で確認できます。一覧からメモをクリックすると、そのメモが作成された位置に視点の角度が自動的に切り替わります。","一覧のプリンターアイコンをクリックすると、印刷設定画面が表示され、A4またはA3サイズに合わせてメモの内容が自動的にレイアウトされます。","プロジェクト名、部屋名、メモの内容、添付画像、作成日も一緒に表示されます。"],
 imgs:[["05_note_list.jpg"],["06_note_list_print.jpg"]],g:"g2"},
{date:"2026/9/17",tag:"No.3",title:"シェアボタン",
 p:["クリックすると、QRコードとURLが表示されます。","QRコードを読み取ったり、URLを共有したりすることで、他の人にVirtual Tourのページを簡単に送ることができます。"],
 imgs:[["07_share.jpg"]],g:"g1"},
{date:"2026/9/17",tag:"No.4",title:"プリントボタン",
 p:["CG画像を印刷するためのボタンです。プロジェクト内の好きなアングルを自由に選択して印刷できます。","印刷設定画面はA4またはA3サイズに対応しています。印刷画像の下には、プロジェクト名や部屋名などの情報が自動的に表示されます。","フォントは、社内の基準に合わせて「Monotype Corsiva」に設定しています。"],
 imgs:[["08_print.jpg"]],g:"g1"},
{date:"2026/9/17",tag:"No.5",title:"VRボタン",
 p:["VRモードに切り替えるためのボタンです。","VRヘッドセットのブラウザから直接Virtual Tourにアクセスして使用できます。パソコンとケーブルで接続する必要はありません。","VRヘッドセットがインターネットに接続されていれば、Virtual Tourを表示できます。"],
 imgs:[["09_VR.jpg"]],g:"g1"},
{date:"2026/9/17",tag:"No.6",title:"フルスクリーンモード",
 p:["すべてのUI、レイアウト、説明テキストなどを非表示にするモードです。","余計な表示をなくし、よりすっきりとした画面でVirtual Tourを見ることができます。"],
 imgs:[["10_fullscreen.jpg"]],g:"g1"},
{date:"2026/9/17",tag:"No.7",title:"図面",
 p:["フロアの図面を表示するための機能です。","図面上に表示されている各ポイントをクリックすると、その位置に対応したアングルへ直接切り替えることができます。"],
 imgs:[["11_layout.jpg"]],g:"g1"},
{date:"2026/9/18",tag:"9/18 アップデート",title:"Auto Tour",
 p:["動画を再生するようなイメージで、360°画像がゆっくり自動で回転し、各シーン（部屋）が自動的に切り替わります。","Auto Tourモードに入るとBGMも自動的に再生されます。画面下部には一時停止ボタンも追加しています。"],
 imgs:[["Auto_Tour_mode_1.jpg"],["Auto_Tour_mode_2.jpg"]],g:"g2"},
{date:"2026/9/18",tag:"9/18 アップデート",title:"3D模型",
 p:["3Dモデルを表示して、自由に回転・ズームできる機能です。さまざまな方向から断面を確認できるセクション機能も追加しました。","3DモデルはArchicadのデータをGLB形式に変換して使用しているため、制作にかかる時間もそれほど多くありません。"],
 imgs:[["MINI_3D_1.jpg"],["MINI_3D_2.jpg"],["MINI_3D_3.jpg"],["MINI_3D_4.jpg"]],g:"g4"},
{date:"2026/9/25",tag:"9/25 アップデート",title:"Integrated Architecture Presentation Platform",
 p:["単なる360°画像の閲覧システムから、建築プロジェクトのさまざまな情報を一つのWeb上で統合して確認できるプラットフォームへと発展させています。","CG、360°パノラマ、3Dモデル、図面、メモなどを個別に表示するのではなく、相互に関連付けることで、プロジェクト全体を一つのWebプラットフォーム上で確認できるシステムを目指しています。"],
 chips:["360°ビュー","フロア切り替え","CG表示","3Dモデル","Auto Tour","メモ","メモの印刷・共有","Gallery Photo Carousel"],
 imgs:[["PHOTO1.jpg"]],g:"g1"},
{date:"2026/9/25",tag:"9/25 アップデート",title:"Gallery Photo Carousel",
 p:["プロジェクトのCGパースや完成イメージなどの画像をカルーセル形式で一覧表示できます。CG画像と360°ビューを連動させ、カルーセル内のCG画像をクリックすると、同じ位置・方向に設定された360°ビューへ自動的に移動します。"],
 flow:["CGで完成イメージを確認する","画像をクリックする","実際の空間を360°で確認する"],
 imgs:[["PHOTO1.jpg"],["PHOTO2.jpg"]],g:"g2"},
{end:1,date:"2026/9/25",title:"今後について",
 p:["まだ開発途中のため、必要に応じて新しい機能を追加し、少しずつ改善しながら、より使いやすいシステムにしていきます。","ご意見やご質問がありましたら、お気軽にお知らせください。"],
 imgs:[["end.jpg"]],g:"g1"}
];
const URL_="https://earnest-architects.github.io/kajanchi3";

const lb=document.getElementById("lb"),stage=document.getElementById("stage"),tk=document.getElementById("ticks"),N=S.length;
const fig=a=>`<figure><img src="${I(a[0])}" alt="${a[0]}" decoding="async">${a[1]===""?"":`<figcaption>${a[0]}</figcaption>`}</figure>`;
const pad=n=>"A-"+String(n).padStart(2,"0");
S.forEach((s,i)=>{
 const hd=`<header><span><b>Kajanchi邸</b>　360° Virtual Tour</span><span>${s.date}</span></header>`;
 const ft=`<footer><span class="snd">差出人：リナルディ</span><span class="pj"><em>プロジェクト</em><strong>Integrated Architecture Presentation Platform</strong></span><span class="no"><em>シート</em><strong>${pad(i+1)} / ${pad(N)}</strong></span></footer>`;
 let t="";
 if(s.cover){t=`<h1>${P}</h1><dl><dt>差出人</dt><dd>リナルディ</dd><dt>宛先</dt><dd>リナルディ、山口厳、赤田貴昭</dd><dt>作成日時</dt><dd>2026/9/17（木） 10:37</dd><dt>最終更新</dt><dd>2026/9/25（金） 15:15</dd></dl><p class="url">検証用プロジェクト：<a href="${URL_}" target="_blank" rel="noopener">${URL_}</a></p>`}
 else{
  t=(s.tag?`<span class="tag">${s.tag}</span>`:"")+`<h2>${s.title}</h2>`+s.p.map(x=>`<p>${x}</p>`).join("");
  if(s.pw)t+=`<div class="pw">パスワード <code>${s.pw}</code></div>`;
  if(s.p2)t+=s.p2.map(x=>`<p>${x}</p>`).join("");
  if(s.chips)t+=`<div class="chips">${s.chips.map(c=>`<span>${c}</span>`).join("")}</div>`;
  if(s.flow)t+=`<ol class="flow">${s.flow.map(c=>`<li>${c}</li>`).join("")}</ol>`;
  if(s.leg)t+=`<ul class="leg">${s.leg.map(l=>`<li><i>${l[0]}</i><span>${l[1]}</span></li>`).join("")}</ul>`;
  if(s.end)t+=`<p><a href="${URL_}" target="_blank" rel="noopener">${URL_}</a></p>`;
 }
 const el=document.createElement("section");
 el.className="sheet"+(s.cover?" cover":"");el.style.zIndex=N-i;
 el.innerHTML=`<div class="face front"><div class="fr">${hd}<main><div class="txt">${t}</div><div class="imgs ${s.g}">${s.imgs.map(fig).join("")}</div></main>${ft}</div><i class="fx curl"></i><i class="fx cast"></i></div><div class="face back"><i class="fx curl"></i></div>`;
 stage.appendChild(el);
 const b=document.createElement("button");b.className="tick";b.setAttribute("aria-label","シート "+pad(i+1));b.onclick=()=>go(i);tk.appendChild(b);
});
const sh=[...stage.children],tc=[...tk.children],rm=matchMedia("(prefers-reduced-motion:reduce)").matches,cl=n=>Math.max(0,Math.min(N-1,n));
let pos=0,tgt=0,raf=0;
const K=18,mk=c=>{const d=document.createElement("div");d.className=c;return d};
function rig(el,p,s){
 const W=stage.clientWidth,H=stage.clientHeight,w=W/K;let r=el._rig;
 if(r&&(r.W!==W||r.H!==H)){r.rig.remove();r=null}
 if(!r){const rg=mk("rig"),ss=[];let par=rg;
  for(let k=0;k<K;k++){const st=mk("st"),sf=mk("sf"),sb=mk("sb"),c=el.querySelector(".front").cloneNode(true);
   c.querySelectorAll(".fx").forEach(x=>x.remove());c.style.cssText=`width:${W}px;height:${H}px;left:${-k*w}px`;
   st.style.width=(w+.8)+"px";st.style.left=(k?w:0)+"px";
   const a=mk("sh"),b=mk("sh");sf.append(c,a);sb.append(b);st.append(sf,sb);par.append(st);par=st;ss.push(st)}
  el.appendChild(rg);r=el._rig={rig:rg,strips:ss,W,H}}
 if(!el.classList.contains("flip")){const o=el.querySelector(".front .txt");r.rig.querySelectorAll(".txt").forEach(t=>t.scrollTop=o.scrollTop)}
 const th=p*180,A=u=>th+s*(60*u*u-20);let prev=0,sx=0;
 r.strips.forEach((st,k)=>{const a=A(k/K),c=Math.cos(a*Math.PI/180),m=a<=90?a:180-a;
  st.style.transform=`rotateY(${-(a-prev)}deg)`;prev=a;sx+=c;
  st.style.setProperty("--d",(.42*(1-Math.abs(c))).toFixed(3));
  st.style.setProperty("--h",((a<=90?.3:.16)*Math.exp(-Math.pow((m-38)/14,2))).toFixed(3))});
 return Math.max(0,sx/K)}
function render(){
 const f=Math.floor(pos+1e-9),p=Math.max(0,pos-f);let exFlip=0;
 sh.forEach((el,i)=>{
  let tf="none",vis=1,op=1,cu=0,ca=0,ex=0,live=false;
  if(i<f){vis=0;tf="rotateY(-180deg)"}
  else if(i===f){const s=Math.sin(p*Math.PI);live=p===0;if(p){tf=`translate3d(0,0,${s*46}px) rotateX(${-s*2.2}deg)`;exFlip=rig(el,p,s)}}
  else{const d=i-pos;if(d>=3)vis=0;const o=Math.min(d,2.2);tf=`translate(${o*6}px,${o*5}px)`;op=Math.max(0,Math.min(1,3-d));
